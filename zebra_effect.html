<!DOCTYPE html>
<html>
<head>
  <title>Zebra Table</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    table{
      width: 50%;
      border-collapse: collapse;
    }

    th, td{
      border: 1px solid black;
      padding: 10px;
      text-align: center;
    }

    .zebra{
      background-color: lightblue;
    }
  </style>
</head>
<body>

  <h2>Zebra Table Effect</h2>

  <table id="myTable">
    <tr>
      <th>ID</th>
      <th>Name</th>
    </tr>

    <tr>
      <td>1</td>
      <td>Sanchi</td>
    </tr>

    <tr>
      <td>2</td>
      <td>Prem</td>
    </tr>

    <tr>
      <td>3</td>
      <td>Devanshi</td>
    </tr>
  </table>

  <button id="btn">Apply Zebra Effect</button>

  <script>
    $("#btn").click(function(){

      $("#myTable tr:odd").addClass("zebra");

    });
  </script>

</body>
</html>
